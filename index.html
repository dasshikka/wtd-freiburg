<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23F7F3EC%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2225%22%20text-anchor%3D%22middle%22%20font-family%3D%22%27Young%20Serif%27%2CGeorgia%2C%27Times%20New%20Roman%27%2Cserif%22%20font-size%3D%2225%22%20font-weight%3D%22600%22%20fill%3D%22%232E342E%22%20letter-spacing%3D%22-1%22%3EF%3C%2Ftext%3E%3C%2Fsvg%3E">
<script>try{if(localStorage.getItem("wtd-theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTD: Freiburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC;--card:#FFFCF8;--text:#2E342E;--text2:#8C877F;
  --border:#E7E0D6;--green:#556B4F;--terra:#B96C52;--lav:#DCCFEA;--must:#E8D18C;
  --sky:#65A1B3;--church:#B04E46;
  --text-muted:#5C6257;--meta-color:#6B6660;--tag-bg:rgba(0,0,0,0.06);
  color-scheme:light;
}
/* ── dark mode ── */
[data-theme="dark"]{
  --bg:#1A1E1A;--card:#232723;--text:#E4DFD6;--text2:#8E8980;
  --border:#363A36;--green:#6B8B65;--terra:#C97C62;--lav:#3A3050;--must:#4A4018;
  --sky:#3A5F74;--church:#C05E56;
  --text-muted:#8A8580;--meta-color:#827E78;--tag-bg:rgba(255,255,255,0.07);
  color-scheme:dark;
}
[data-theme="dark"] .hdr-hero-overlay{background:linear-gradient(to bottom,rgba(26,30,26,0) 0%,rgba(26,30,26,0.05) 40%,rgba(26,30,26,0.72) 78%,rgba(26,30,26,1) 100%)}
[data-theme="dark"] .ev-experience{background:oklch(99.2% 0.012 80)}
[data-theme="dark"] .btn-outline{background:rgba(35,39,35,0.85);color:var(--text)}
[data-theme="dark"] .modal-box{box-shadow:0 20px 64px rgba(0,0,0,0.4);animation:modalBoxIn 0.32s cubic-bezier(0.16,1,0.3,1) both}

/* ── dark mode hover overrides ── */
[data-theme="dark"] .clear-btn:hover{background:rgba(201,124,98,0.15)}
[data-theme="dark"] .mood-pill:hover{background:var(--must);border-color:var(--terra)}
[data-theme="dark"] .pill.on{background:var(--border);color:var(--text);border-color:var(--text2)}
[data-theme="dark"] .pill:hover{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .btn-more:hover{background:rgba(255,255,255,0.05)}
[data-theme="dark"] .act-src:hover{background:rgba(100,160,200,0.12)}
[data-theme="dark"] .act:hover{background:rgba(255,255,255,0.06);color:var(--text)}
[data-theme="dark"] .modal-act:hover{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .empty-suggestions button:hover{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .empty-suggestions button.clr:hover{background:rgba(201,124,98,0.15)}
[data-theme="dark"] .saved-item-rm:hover{color:var(--terra)}
[data-theme="dark"] .btn-outline:hover{background:rgba(255,255,255,0.08);color:var(--text)}
[data-theme="dark"] .btn-dark:hover{background:#5a7855}
[data-theme="dark"] .dark-switch-wrap:hover{border-color:rgba(228,223,214,0.25)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}

/* ── hero header ── */
.hdr-hero{position:relative;height:320px;overflow:hidden;border-bottom:1px solid var(--border)}
.hdr-hero-bg{position:absolute;inset:-80px 0;background-size:cover;background-position:center 30%;will-change:transform}
.hdr-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(247,243,236,0) 0%,rgba(247,243,236,0.05) 40%,rgba(247,243,236,0.72) 78%,rgba(247,243,236,1) 100%)}
.hdr-hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 36px 26px}
.hdr-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;max-width:1280px;margin:0 auto}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hdr-l h1{font-family:'Young Serif',Georgia,serif;font-size:80px;font-weight:600;letter-spacing:-1.5px;color:var(--text);line-height:0.9;animation:heroIn 0.7s cubic-bezier(0.16,1,0.3,1) both}
.hdr-l p{font-size:13px;color:var(--text2);margin-top:10px;font-weight:400;letter-spacing:0.01em;animation:heroIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.09s both}
.hdr-r{display:flex;gap:8px;flex-shrink:0;padding-bottom:4px;animation:heroIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.16s both}
.btn-dark{background:var(--sky);color:#fff;border:none;border-radius:8px;padding:8px 17px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;letter-spacing:0.01em}
.btn-dark:hover{background:#558999}
.btn-outline{background:none;border:1px solid rgba(46,52,46,0.22);color:var(--text2);border-radius:8px;padding:8px 17px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;letter-spacing:0.01em;white-space:nowrap}
.btn-outline:hover{background:var(--lav);border-color:#BBA8D4;color:var(--text)}

/* ── mood bar ── */
.mood-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mood-bar-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1280px;margin:0 auto;width:100%}
.mood-pill{background:var(--bg);border:1px solid var(--border);border-radius:24px;padding:8px 17px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit;transition:background 0.12s,border-color 0.12s}
.mood-pill:hover{background:var(--must);border-color:#CDBA6E}
.mood-pill.on{background:var(--green);color:#fff;border-color:var(--green)}
.mood-sep{width:0.5px;height:20px;background:var(--border);flex-shrink:0}
.mood-time-group{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn-more{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-more:hover{background:var(--bg);color:var(--text)}
.btn-more.open{color:var(--text);background:var(--bg);border-color:var(--border)}
.clear-btn{background:none;border:1px solid #E4A593;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--terra);cursor:pointer;font-family:inherit}
.clear-btn:hover{background:#FEF0EC}

/* ── more filters panel ── */
.more-filters-wrap{background:var(--card);border-bottom:1px solid var(--border)}
.frow-sep{width:100%;height:0}
.flbl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;min-width:56px;font-family:inherit}
.pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--card);color:var(--text2);white-space:nowrap;font-family:inherit}
.pill:hover{background:var(--bg)}
.pill.on{background:var(--text);color:#fff;border-color:var(--text)}
.pill.on-low{background:var(--bg);color:var(--text);border-color:var(--border)}
.pill.on-med{background:var(--bg);color:var(--text);border-color:var(--border)}
.pill.on-high{background:var(--bg);color:var(--text);border-color:var(--border)}
.sep{width:0.5px;height:14px;background:var(--border);margin:0 2px;flex-shrink:0}

/* ── body / layout ── */
.body{padding:60px 36px 96px;max-width:1280px;margin:0 auto}

/* ── section headers ── */
.sec-hdr{font-family:'Young Serif',Georgia,serif;font-size:22px;font-weight:500;color:var(--text);margin-bottom:28px;display:flex;align-items:center;gap:14px;letter-spacing:-0.3px;line-height:1;opacity:0;transform:translateY(8px);transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1),transform 0.5s cubic-bezier(0.16,1,0.3,1)}
.sec-hdr.revealed{opacity:1;transform:translateY(0)}
.sec-line{flex:1;height:0.5px;background:var(--border)}
.sec-count{font-size:13px;font-weight:400;color:var(--text2);font-family:'Manrope',sans-serif;letter-spacing:0}
.sec-link{font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;text-decoration:none;font-family:'Manrope',sans-serif;flex-shrink:0;border-bottom:0.5px solid var(--border)}
.sec-link:hover{color:var(--text);border-bottom-color:var(--text2)}

/* ── top picks row ── */
#top-picks{margin-bottom:72px}
.tp-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}

/* ── grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
#disc{margin-bottom:72px}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow 0.15s,border-color 0.15s}
.card:hover{border-color:rgba(46,52,46,0.2);box-shadow:0 4px 22px rgba(46,52,46,0.07)}
.card.top-card{min-width:0;max-width:none;flex-shrink:unset}

/* ── card image strip ── */
.card{position:relative}
.card-img{height:36px;margin:-20px -20px 16px;flex-shrink:0;border-radius:14px 14px 0 0;position:relative;overflow:hidden}

/* ── header action buttons ── */
.btn-outline{background:rgba(255,252,248,0.72);color:var(--text);border:1px solid rgba(46,52,46,0.22);border-radius:8px;padding:8px 17px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;letter-spacing:0.01em;backdrop-filter:blur(4px);contain:layout style}
.btn-outline:hover{background:rgba(255,252,248,0.92)}

/* ── badges ── */
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap;font-family:'Manrope',sans-serif;display:inline-flex;align-items:center;gap:5px;line-height:1.4}
.b-cat{background:var(--bg);color:var(--text2);border:0.5px solid var(--border)}
.b-pick{background:#FBF0EE;color:var(--church);border:0.5px solid #E4B8B4;font-size:10.5px;padding:2px 8px}

/* ── energy bolts — positioned inside category header strip ── */
.card-nrg-inner{position:absolute;bottom:7px;left:12px;display:flex;align-items:center;gap:2px;color:rgba(255,255,255,0.72)}
.strip-cat-text{position:absolute;bottom:7px;right:12px;font-size:11px;font-weight:500;color:rgba(255,255,255,0.82);font-family:'Manrope',sans-serif;white-space:nowrap;letter-spacing:0.02em}
.bolt-svg{display:inline-block;vertical-align:middle;flex-shrink:0}
.card-nrg{display:flex;align-items:center;gap:2px;color:#A09888;opacity:0.7}
.card-nrg svg{display:block}

/* ── card content ── */
.ctitle{font-family:'Young Serif',Georgia,serif;font-size:17px;font-weight:600;line-height:1.3;color:var(--text);margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-0.3px}
.cgerman{font-size:12px;color:var(--text2);font-style:italic;margin-bottom:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:'Manrope',sans-serif}
.cmeta{font-size:13px;color:var(--text2);margin-bottom:10px;font-family:'Manrope',sans-serif;display:flex;flex-direction:column;gap:3px}
.cm-when{color:var(--text);font-weight:500;font-size:13px}
.cm-loc{color:var(--sky);font-size:12.5px;font-weight:500}
.cm-price{color:var(--text-muted);font-size:12px}
.cwhy{font-family:'Manrope',system-ui,sans-serif;font-size:13px;font-style:normal;color:var(--text-muted);line-height:1.6;margin-bottom:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cdetails{font-size:13px;color:var(--text2);line-height:1.65;background:var(--bg);border-radius:9px;padding:12px 13px;margin-bottom:11px;border:1px solid var(--border);font-family:'Manrope',sans-serif}
.cdetails.hidden{display:none}
@keyframes hintBreathe{0%,100%{opacity:0.22}55%{opacity:0.55}}
.cexpand-hint{text-align:center;font-size:10px;color:var(--text2);opacity:0.25;margin:-6px 0 6px;letter-spacing:3px;pointer-events:none;user-select:none}
.card:hover .cexpand-hint{animation:hintBreathe 2.8s ease-in-out infinite}

/* ── card actions ── */
.cactions{display:flex;align-items:center;gap:0;margin-top:auto;padding-top:11px;border-top:1px solid var(--border)}
.act{background:none;border:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);padding:3px 8px;border-radius:6px;white-space:nowrap;font-family:inherit}
.act:hover{background:var(--bg);color:var(--text)}
.act.saved{color:var(--terra)}
.act-hide{color:var(--text2);opacity:0.5;font-weight:400}
.act-hide:hover{opacity:1;color:var(--church)}
.act-src{color:var(--sky);text-decoration:none;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;font-family:inherit;transition:color 0.12s}
.act-src:hover{background:rgba(74,124,201,0.08)}
.act-more{margin-left:auto;color:var(--border);font-size:12px}
.act-more:hover{color:var(--text2)!important;background:var(--bg)!important}

/* ── surprise modal ── */
@keyframes modalIn{from{opacity:0}to{opacity:1}}
@keyframes modalBoxIn{from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-overlay{position:fixed;inset:0;background:rgba(247,243,236,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);contain:strict;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:modalIn 0.22s ease-out both}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:440px;width:100%;padding:32px;position:relative;box-shadow:0 20px 64px rgba(46,52,46,0.14)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:var(--text2);font-size:13px;padding:5px 9px;border-radius:7px;font-family:inherit;font-weight:500;line-height:1}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-badges{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.modal-title{font-family:'Young Serif',Georgia,serif;font-size:26px;font-weight:600;color:var(--text);line-height:1.25;margin-bottom:7px;letter-spacing:-0.4px}
.modal-german{font-size:12px;color:var(--text2);font-style:italic;margin-bottom:14px;font-family:'Manrope',sans-serif}
.modal-meta{font-size:13px;color:var(--text2);line-height:1.9;margin-bottom:16px;font-family:'Manrope',sans-serif}
.modal-meta strong{color:var(--text);font-weight:500}
.modal-why{font-family:'Young Serif',Georgia,serif;font-size:16px;font-style:normal;color:#5C6257;line-height:1.6;margin-bottom:24px}
.modal-actions{display:flex;align-items:center;gap:8px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-act{background:none;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;transition:background 0.1s}
.modal-act:hover{background:var(--bg);color:var(--text)}
.modal-act.saved{color:var(--terra);border-color:#E4A593}
.modal-act.saved:hover{background:#FEF0EC}
.modal-act-src{color:var(--sky);text-decoration:none;font-size:12px;font-weight:500;padding:7px 16px;border:1px solid rgba(74,124,201,0.3);border-radius:20px;font-family:inherit}
.modal-act-src:hover{background:rgba(74,124,201,0.06)}
.modal-act-again{background:var(--green);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;margin-left:auto}
.modal-act-again:hover{background:#445a3f}

/* ── saved section ── */
@keyframes sectionReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#saved-section{margin-top:32px}
#saved-section:not(.hidden){animation:sectionReveal 0.45s cubic-bezier(0.16,1,0.3,1) both}
.saved-list{display:flex;flex-direction:column;gap:8px}
.saved-item{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:10px}
.saved-item-info{flex:1;min-width:0}
.saved-item-title{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text);font-size:14px}
.saved-item-meta{color:var(--text2);font-size:12px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.saved-item-rm{background:none;border:none;cursor:pointer;color:var(--border);font-size:14px;flex-shrink:0;padding:0 3px}
.saved-item-rm:hover{color:var(--terra)}

/* ── empty / hidden bar ── */
.empty-state{text-align:center;padding:80px 20px;animation:heroIn 0.4s cubic-bezier(0.16,1,0.3,1) both}
.empty-state p{font-family:'Young Serif',Georgia,serif;font-size:18px;font-style:normal;color:var(--text2);margin-bottom:20px}
.empty-suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.empty-suggestions button{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.empty-suggestions button:hover{background:var(--bg)}
.empty-suggestions button.clr{color:var(--terra);border-color:#E4A593}
.empty-suggestions button.clr:hover{background:#FEF0EC}
@keyframes barDrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.hidden-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;margin-top:14px;font-size:12px;color:var(--text2);font-family:'Manrope',sans-serif;animation:barDrop 0.3s cubic-bezier(0.16,1,0.3,1) both}
.hidden-bar button{background:none;border:none;cursor:pointer;color:var(--text2);font-size:12px;text-decoration:underline;font-family:inherit;transition:color 0.12s}
.hidden-bar button:hover{color:var(--text)}
.hidden-bar button:hover{color:var(--text)}
.hidden{display:none!important}

/* ── a11y ── */
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── responsive ── */
.pill{min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.act{min-height:36px}
@media(max-width:1100px){
  .tp-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .hdr-l h1{font-size:clamp(36px,8vw,54px);letter-spacing:-1px}
  .mood-bar-inner{flex-wrap:wrap}
  .mood-time-group{margin-left:0;flex-wrap:wrap}
  .sec-hdr{font-size:18px}
  .hdr-hero-content{padding:28px 24px 24px}
}
@media(max-width:640px){
  .hdr-l h1{font-size:clamp(28px,9vw,38px);letter-spacing:-0.5px}
  .tp-row{grid-template-columns:1fr}
  .hdr-inner{flex-direction:column;gap:16px;align-items:flex-start}
  .hdr-r{width:100%;justify-content:flex-start}
  .body{padding:28px 16px 48px}
  .mood-bar{padding:12px 16px}
  .more-filters-wrap{padding:12px 16px}
  .grid{grid-template-columns:1fr}
}

/* ── experience cards ── */
.ev-experience{background:oklch(99.4% 0.009 80)}
.ev-experience .ctitle::after{content:" ✦";font-size:9px;opacity:0.4;vertical-align:super;font-family:system-ui}

/* ── card interactivity ── */
.card{transition:transform 0.15s ease-out,box-shadow 0.15s ease-out}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,52,46,0.09)}
.card:has(.cdetails:not(.hidden)){box-shadow:0 10px 36px rgba(46,52,46,0.13);border-color:rgba(46,52,46,0.22);transform:translateY(-1px)}
.card:active{transform:translateY(0);box-shadow:none}
.cdetails{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.6;color:var(--text-muted);animation:detailFade 0.2s ease-out}

/* ── card entrance stagger ── */
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid .card{animation:cardIn 0.22s ease-out both;animation-delay:calc(var(--ci,0)*28ms)}
.tp-row .card{animation:cardIn 0.22s ease-out both;animation-delay:calc(var(--ci,0)*55ms)}

/* ── save pulse ── */
@keyframes savePop{0%,100%{transform:scale(1)}45%{transform:scale(1.12)}72%{transform:scale(0.97)}}
.act.save-pop{animation:savePop 0.32s cubic-bezier(0.16,1,0.3,1)}

/* ── pill press feedback ── */
.mood-pill{transition:background 0.12s,border-color 0.12s,color 0.12s,transform 0.07s}
.mood-pill:active{transform:scale(0.94)}
.pill{transition:background 0.12s,border-color 0.12s,color 0.12s,transform 0.07s}
.pill:active{transform:scale(0.94)}

/* ── more-filters smooth slide ── */
.frow-more-animated{display:flex;flex-wrap:wrap;align-items:center;gap:7px;max-height:0;overflow:hidden;padding:0 36px;opacity:0;transition:max-height 0.28s cubic-bezier(0.4,0,0.2,1),padding 0.22s ease-out,opacity 0.22s ease-out;max-width:1280px;margin:0 auto}
.frow-more-animated.open{max-height:220px;padding:14px 36px;opacity:1}

.loc-link:hover{color:var(--church);text-decoration:underline;text-underline-offset:2px}
.loc-icon{flex-shrink:0;margin-top:1px;opacity:0.85;transition:transform 0.2s cubic-bezier(0.16,1,0.3,1)}
.loc-link:hover .loc-icon{transform:translateY(-2px)}

/* ── dark mode switch (fixed top-right) ── */
.dark-switch-wrap{
  position:fixed;top:16px;right:20px;z-index:500;

  background:var(--card);border:1px solid var(--border);

}
.dark-switch-wrap:hover{border-color:rgba(46,52,46,0.3);box-shadow:0 3px 16px rgba(46,52,46,0.14)}
.dark-switch-icon{font-size:13px;line-height:1;transition:transform 0.3s ease}
.dark-switch-track{
  width:34px;height:19px;border-radius:10px;

  position:relative;flex-shrink:0;
  transition:background 0.22s ease;
}
.dark-switch-track.on{background:var(--green)}
.dark-switch-thumb{

  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.18);
  transition:transform 0.22s cubic-bezier(0.16,1,0.3,1);
}
.dark-switch-track.on .dark-switch-thumb{transform:translateX(15px)}
[data-theme="dark"] .dark-switch-wrap{box-shadow:0 2px 12px rgba(0,0,0,0.35)}
</style>

  {id:44,

   title:"Burkheim am Kaiserstuhl — The Intact Wine Village",

   loc:"Burkheim, Vogtsburg im Kaiserstuhl (~26 km)",price:"Free",pv:0,dist:26,
   cat:"village-life",nrg:"low",
   why:"The most intact medieval wine village on the Kaiserstuhl — half-timbered Winzerhäuser, a Romanesque church, a ruined castle above the vines, Alsace visible across the Rhine plain. Almost no visitors.",
   src:"https://www.vogtsburg.de/",top:false,
   det:"Burkheim sits on the western Kaiserstuhl rim, overlooking the Rhine. The old town survived the 17th-century wars intact — a compact street of half-timbered winemakers’ houses, a Johanniterkirche from the 13th century, and the remains of a medieval castle on the vine terrace above. One Weinstube opens at midday. Reachable by S-Bahn to Breisach, then cycle 8km or take a bus. Tourists end up at Achkarren or Ihringen; Burkheim stays quiet."},

(function(){
  (window.requestIdleCallback||window.setTimeout)(function(){
    const bg=document.getElementById('hero-bg');
    if(bg) bg.style.backgroundImage="url('"+HERO_IMG+"')";
  });
  let _scrollTick=false;
  window.addEventListener('scroll',function(){
    if(!_scrollTick){
      _scrollTick=true;
      requestAnimationFrame(function(){
        const bg=document.getElementById('hero-bg');
        if(bg) bg.style.transform='translateY('+(window.scrollY*0.35)+'px)';
        const heroL=document.querySelector('.hdr-l');
        if(heroL){const f=Math.max(0,1-Math.max(0,window.scrollY-60)/200);heroL.style.opacity=f;}
        _scrollTick=false;
      });
    }
  },{passive:true});
})();


/* ── dark mode ── */
function toggleDark(){
  const isDark=document.documentElement.dataset.theme==='dark';
  const next=isDark?'':'dark';
  document.documentElement.dataset.theme=next;
  syncDarkSwitch(next==='dark');
  try{localStorage.setItem('wtd-theme',isDark?'light':'dark');}catch(e){}
}
function syncDarkSwitch(on){
  const track=document.getElementById('dark-track');
  const icon=document.getElementById('dark-icon');
  const sw=document.getElementById('dark-switch');
  if(track)track.classList.toggle('on',on);
  if(icon)icon.textContent=on?'☀️':'🌙';
  if(sw)sw.setAttribute('aria-checked',on?'true':'false');
}
(function initTheme(){
  // Script runs at body bottom — DOM already ready, no need for DOMContentLoaded
  try{
    const dark=localStorage.getItem('wtd-theme')==='dark';
    if(dark) document.documentElement.dataset.theme='dark';
    syncDarkSwitch(dark);
  }catch(e){}
})();

let _modal=null,_scrollY=0;

function inTime(e){
  const d=new Date(e.date),now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=t.getDay(),dToSat=(6-dow+7)%7||7,sat=new Date(t.getTime()+dToSat*864e5),sun=new Date(sat.getTime()+864e5),w7=new Date(t.getTime()+6*864e5),w30=new Date(t.getTime()+29*864e5);
  if(S.time==="today") return +d===+t;
  if(S.time==="weekend") return d>=sat&&d<=sun;
  if(S.time==="7days") return d>=t&&d<=w7;
  if(S.time==="30days") return d>=t&&d<=w30;
  return true;
}
function inPrice(e){if(S.price==="free") return e.pv===0;if(S.price==="u15") return e.pv<15;return true;}
function inDist(e){return e.dist<=S.dist;}
function match(e){
  if(!inTime(e)||!inPrice(e)||!inDist(e)) return false;
  if(S.energy.length&&!S.energy.includes(e.nrg)) return false;
  if(S.category.length&&!S.category.includes(e.cat)) return false;
  return true;
}
function matchTop(e){
  // top picks: skip time filter, respect mood/price/dist
  if(!inPrice(e)||!inDist(e)) return false;
  if(S.energy.length&&!S.energy.includes(e.nrg)) return false;
  if(S.category.length&&!S.category.includes(e.cat)) return false;
  return true;
}

function cardImgHtml(e){
  const col=CAT_COLOR[e.cat]||"#A09888";
  const _nrgLbl={low:'Low energy',medium:'Medium energy',high:'High energy'};
  const nrg=`<span class="card-nrg-inner" title="${_nrgLbl[e.nrg]||''}">${NRG_DOTS[e.nrg]}</span>`;
  const cat=`<span class="strip-cat-text">${CATLBLS[e.cat]||e.cat}</span>`;
  return`<div class="card-img" style="background-color:${col}">${nrg}${cat}</div>`;
}

function cardHtml(e,mode,ci){ci=ci||0;
  const isSaved=S.saved.includes(e.id);
  const isOpen=S.open.has(e.id);
  const cls=["card"];
  if(mode==="top") cls.push("top-card");
  if(e.type==="experience") cls.push("ev-experience");
  const imgHtml=cardImgHtml(e);
  return`<div class="${cls.join(' ')}" onclick="toggleOpen(${e.id},event)" style="cursor:pointer;--ci:${ci}">
${imgHtml}
<div class="ctitle">${e.title}</div>
<div class="cmeta"><span class="cm-when">${e.dd} · ${e.time}</span><span class="cm-loc"><a class="loc-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.loc)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg class="loc-icon" viewBox="0 0 12 16" width="10" height="13" fill="currentColor" aria-hidden="true"><path d="M6 0C3.24 0 1 2.24 1 5c0 3.75 5 11 5 11s5-7.25 5-11c0-2.76-2.24-5-5-5zm0 7.5A2.5 2.5 0 1 1 6 2.5 2.5 2.5 0 0 1 6 7.5z"/></svg>${e.loc}</a></span><span class="cm-price">${e.price}</span></div>
<div class="cwhy">${e.why}</div>
${isOpen?'':`<div class="cexpand-hint">· · ·</div>`}
${isOpen?`<div class="cdetails">${e.german?`<span style="display:block;font-size:11px;font-style:italic;color:var(--text2);margin-bottom:7px;opacity:0.75">${e.german}</span>`:""  }${e.det}</div>`:'<div class="cdetails hidden"></div>'}
<div class="cactions">
  <button type="button" class="act${isSaved?' saved':''}" onclick="toggleSave(${e.id},event)" title="${isSaved?'Saved in this browser':'Save to this browser'}">${isSaved?'♥ Saved':'♡ Save'}</button>
  ${mode!=='top'?`<button type="button" class="act act-hide" onclick="hideEv(${e.id},event)">Skip</button>`:''}
  <a class="act-src" href="${e.src}" target="_blank" onclick="event.stopPropagation()">↗ Website</a>
</div>
</div>`;
}

function modalHtml(e){
  const isSaved=S.saved.includes(e.id);
  return`<div class="modal-box">
<button type="button" class="modal-close" onclick="closeModal()">✕</button>
<div class="card-nrg nrg-${e.nrg}" style="margin-bottom:12px">${NRG_DOTS[e.nrg]}</div>
<div class="modal-badges">
  <span class="badge b-cat">${CATLBLS[e.cat]||e.cat}</span>
  ${e.top?'<span class="badge b-pick">⭐ Editor Pick</span>':''}
</div>
<div class="modal-title">${e.title}</div>
${e.german?`<div class="modal-german">${e.german}</div>`:''}
<div class="modal-meta">
  <div class="cm-when" style="font-size:14px">${e.dd} · ${e.time}</div>
  <div class="cm-loc"><a class="loc-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.loc)}" target="_blank" rel="noopener">${e.loc}</a></div>
  <div class="cm-price">${e.price}</div>
</div>
<div class="modal-why">${e.why}</div>
<div class="modal-actions">
  <button type="button" class="modal-act${isSaved?' saved':''}" onclick="toggleSaveModal(${e.id},this)">${isSaved?'♥ Saved':'♡ Save'}</button>
  <a class="modal-act-src" href="${e.src}" target="_blank">↗ Website</a>
  <button type="button" class="modal-act-again" onclick="doSurprise()">🎲 Try another</button>
</div>
</div>`;
}

function emptyStateHtml(){
  const s=[];
  if(S.mood) s.push('<button type="button" onclick="clearMood()">Clear mood</button>');
  if(S.time==="today"||S.time==="weekend") s.push('<button type="button" onclick="broadenTime()">Show this week</button>');
  if(S.energy.length) s.push('<button type="button" onclick="clearGroup(\'energy\')">Clear energy</button>');
  if(S.category.length) s.push('<button type="button" onclick="clearGroup(\'category\')">Clear category</button>');
  s.push('<button type="button" class="clr" onclick="clearAll()">Clear all</button>');
  return`<div class="empty-state"><p>Nothing here for these filters.</p><div class="empty-suggestions">${s.join("")}</div></div>`;
}

function animRender(){
  const els=[document.getElementById("tp-row"),document.getElementById("disc-grid")];
  els.forEach(el=>{if(el){el.style.opacity="0";}});
  setTimeout(()=>{
    render();
    requestAnimationFrame(()=>{els.forEach(el=>{if(el)el.style.opacity="1";});});
  },100);
}
function render(){
  const topEvs=EV.filter(e=>e.top&&!S.hidden.has(e.id)&&matchTop(e));
  document.getElementById("tp-row").innerHTML=topEvs.map((e,i)=>cardHtml(e,"top",i)).join("");
  const topIds=new Set(EV.filter(e=>e.top).map(e=>e.id));
  const disc=EV.filter(e=>!topIds.has(e.id)&&!S.hidden.has(e.id)&&match(e));
  document.getElementById("disc-count").textContent=disc.length?`(${disc.length})`:'';
  document.getElementById("disc-grid").innerHTML=disc.length?disc.map((e,i)=>cardHtml(e,"grid",i)).join(""):emptyStateHtml();
  const allVis=[...topEvs,...disc];
  const _M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],_n=new Date(),_t2=new Date(_n.getFullYear(),_n.getMonth(),_n.getDate()),_w=new Date(_t2.getTime()+6*864e5),_fd=d=>`${d.getDate()} ${_M[d.getMonth()]}`;  const lbl=`${_fd(_t2)} – ${_fd(_w)} · ${allVis.length} event${allVis.length!==1?'s':''}`;
  document.getElementById("ecount-label").textContent=lbl;
  const hCnt=S.hidden.size;
  document.getElementById("hidden-bar-wrap").innerHTML=hCnt?`<div class="hidden-bar">${hCnt} event${hCnt>1?'s':''} hidden — <button type="button" onclick="unhideAll()">Restore hidden</button></div>`:'';
  const hasF=S.mood||S.energy.length||S.category.length||S.time!=="7days"||S.price!=="any"||S.dist!==30;
  document.getElementById("clrbtn").style.display=hasF?"inline-block":"none";
  const savedEvs=EV.filter(e=>S.saved.includes(e.id));
  const sec=document.getElementById("saved-section");
  if(savedEvs.length){
    sec.classList.remove("hidden");
    document.getElementById("saved-list").innerHTML=savedEvs.map(e=>`<div class="saved-item"><div class="saved-item-info"><div class="saved-item-title">${e.title}</div><div class="saved-item-meta">${e.dd} · ${e.time} · <a class="loc-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.loc)}" target="_blank" rel="noopener">${e.loc}</a></div></div><button type="button" class="saved-item-rm" onclick="toggleSave(${e.id},event)" title="Remove">✕</button></div>`).join("");
  } else {
    sec.classList.add("hidden");
  }
}

/* ── surprise modal ── */
function doSurprise(){
  const unique=EV.filter(e=>!S.hidden.has(e.id));
  const candidates=unique.filter(e=>!S.surpriseHist.includes(e.id));
  const pick=candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:unique[Math.floor(Math.random()*unique.length)];
  if(!pick) return;
  S.surpriseHist.push(pick.id);
  if(S.surpriseHist.length>3) S.surpriseHist.shift();
  if(!_modal){
    _scrollY=window.scrollY;
    _modal=document.createElement('div');
    _modal.className='modal-overlay';
    _modal.addEventListener('click',(ev)=>{if(ev.target===_modal) closeModal();});
    document.body.appendChild(_modal);
    document.body.style.overflow='hidden';
  }
  _modal.innerHTML=modalHtml(pick);
}
function closeModal(){
  if(!_modal) return;
  _modal.style.animation="modalIn 0.16s ease-out reverse both";
  const _box=_modal.querySelector(".modal-box");
  if(_box) _box.style.animation="modalBoxIn 0.16s cubic-bezier(0.16,1,0.3,1) reverse both";
  setTimeout(()=>{
    if(_modal){_modal.remove();_modal=null;}
    document.body.style.overflow="";
    window.scrollTo(0,_scrollY);
  },150);
}
function toggleSaveModal(id,btn){
  const i=S.saved.indexOf(id);
  if(i>-1){S.saved.splice(i,1);btn.className='modal-act';btn.textContent='♡ Save';}
  else{S.saved.push(id);btn.className='modal-act saved';btn.textContent='♥ Saved';}
  render();
  try{localStorage.setItem('wtd-saved',JSON.stringify(S.saved));}catch(e){}
}
document.addEventListener('keydown',(ev)=>{if(ev.key==='Escape') closeModal();});

/* ── mood ── */
function setMood(btn,mood){
  const off=S.mood===mood;
  S.mood=off?null:mood;
  S.energy=[];S.category=[];
  document.querySelectorAll(".mood-pill").forEach(b=>{b.classList.remove("on");b.setAttribute('aria-pressed','false')});
  document.querySelectorAll("[data-t]").forEach(b=>{b.classList.remove("on","on-low","on-med","on-high");b.setAttribute('aria-pressed','false')});
  if(!off){
    const m=MOODS[mood];
    S.energy=[...m.energy];S.category=[...m.category];
    btn.classList.add("on");btn.setAttribute('aria-pressed','true');
    S.energy.forEach(v=>{const b=document.querySelector(`[data-t="energy"][data-v="${v}"]`);if(b)b.classList.add(v==="low"?"on-low":v==="medium"?"on-med":"on-high");});
    S.category.forEach(v=>{const b=document.querySelector(`[data-t="category"][data-v="${v}"]`);if(b)b.classList.add("on");});
  }
  animRender();
}
function clearMood(){
  S.mood=null;
  document.querySelectorAll(".mood-pill").forEach(b=>b.classList.remove("on"));
  S.energy=[];S.category=[];
  document.querySelectorAll("[data-t]").forEach(b=>b.classList.remove("on","on-low","on-med","on-high"));
  render();
}

/* ── filter helpers ── */
function broadenTime(){setTime(document.querySelector('[data-g="time"][data-v="7days"]'),'7days');}
function clearGroup(t){S[t]=[];document.querySelectorAll(`[data-t="${t}"]`).forEach(b=>b.classList.remove("on","on-low","on-med","on-high"));render();}
function toggleMoreFilters(btn){
  const sec=document.getElementById("more-filters");
  const open=sec.classList.toggle("open");
  btn.classList.toggle("open",open);
  btn.textContent=open?"Refine ▴":"Refine ▾";
}
function setTime(btn,v){
  S.mood=null;document.querySelectorAll(".mood-pill").forEach(b=>b.classList.remove("on"));
  S.time=v;document.querySelectorAll('[data-g="time"]').forEach(b=>{b.classList.remove("on");b.setAttribute('aria-pressed','false')});btn.classList.add("on");btn.setAttribute('aria-pressed','true');animRender();
}
function setPrice(btn,v){
  S.mood=null;document.querySelectorAll(".mood-pill").forEach(b=>b.classList.remove("on"));
  S.price=v;document.querySelectorAll('[data-g="price"]').forEach(b=>{b.classList.remove("on");b.setAttribute('aria-pressed','false')});btn.classList.add("on");btn.setAttribute('aria-pressed','true');animRender();
}
function setDist(btn,v){
  S.mood=null;document.querySelectorAll(".mood-pill").forEach(b=>b.classList.remove("on"));
  S.dist=v;document.querySelectorAll('[data-g="dist"]').forEach(b=>{b.classList.remove("on");b.setAttribute('aria-pressed','false')});btn.classList.add("on");btn.setAttribute('aria-pressed','true');animRender();
}
function tog(btn){
  S.mood=null;document.querySelectorAll(".mood-pill").forEach(b=>b.classList.remove("on"));
  const t=btn.dataset.t,v=btn.dataset.v,arr=S[t],i=arr.indexOf(v);
  if(i>-1){arr.splice(i,1);btn.classList.remove("on","on-low","on-med","on-high");btn.setAttribute('aria-pressed','false');}
  else{arr.push(v);if(t==="energy")btn.classList.add(v==="low"?"on-low":v==="medium"?"on-med":"on-high");else btn.classList.add("on");btn.setAttribute('aria-pressed','true');}
  render();
}
function clearAll(){
  S.mood=null;S.energy=[];S.category=[];S.time="7days";S.price="any";S.dist=30;
  document.querySelectorAll(".mood-pill,[data-t]").forEach(b=>b.classList.remove("on","on-low","on-med","on-high"));
  document.querySelectorAll("[data-g='time']").forEach(b=>b.classList.remove("on"));
  document.querySelector("[data-g='time'][data-v='7days']").classList.add("on");
  document.querySelectorAll("[data-g='price']").forEach(b=>b.classList.remove("on"));
  document.querySelector("[data-g='price'][data-v='any']").classList.add("on");
  document.querySelectorAll("[data-g='dist']").forEach(b=>b.classList.remove("on"));
  document.querySelector("[data-g='dist'][data-v='30']").classList.add("on");
  animRender();
}

/* ── card actions ── */
function toggleSave(id,ev){ev.stopPropagation();const i=S.saved.indexOf(id);if(i>-1){S.saved.splice(i,1);}else{S.saved.push(id);const btn=ev.currentTarget;btn.classList.add("save-pop");setTimeout(()=>btn.classList.remove("save-pop"),400);}render();try{localStorage.setItem('wtd-saved',JSON.stringify(S.saved));}catch(e){}}
function hideEv(id,ev){ev.stopPropagation();S.hidden.add(id);render();}
function unhideAll(){S.hidden.clear();render();}
function clearSaved(){S.saved=[];try{localStorage.removeItem('wtd-saved');}catch(e){}render();}
function toggleOpen(id,ev){ev.stopPropagation();S.open.has(id)?S.open.delete(id):S.open.add(id);render();}

render();
/* ── section header scroll reveal ── */
(function(){
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add("revealed");io.unobserve(e.target);}
    });
  },{threshold:0.15});
  document.querySelectorAll(".sec-hdr").forEach(h=>io.observe(h));
})();
</script>
</body>
</html>
